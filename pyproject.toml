[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timing-huatai"
version = "0.1.0"
description = "华泰金工 10 因子技术打分择时系统复现库 (Replication of Huatai Technical Scoring Market Timing System)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ZhangRui", email = "tianyunxiaoxiao@users.noreply.github.com"}
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "pyarrow>=10.0.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
